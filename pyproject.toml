[project]
name = "shardlight"
version = "0.1.0"
description = "Shardlight: eight fractured worlds around one broken lens (Pygame CE)"
requires-python = ">=3.12"
dependencies = ["pygame-ce==2.5.8", "numpy==2.5.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
