name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the browser bundle (pygbag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pygbag
      - name: Install ffmpeg (for the OGG conversion)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - uses: actions/cache@v4
        id: audio-cache
        with:
          path: assets/audio
          key: web-audio-${{ runner.os }}-${{ hashFiles('tools/gen_audio.py', 'shardlight/**/*.py') }}
      - name: Render the procedural audio (about a minute)
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: python tools/gen_audio.py
      - name: Convert the audio to OGG (much smaller, and what browsers want)
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: python tools/to_ogg.py
      - name: pygbag build
        # pygbag always treats the last argument as the app dir; keep flags before it.
        run: python -m pygbag --build --disable-sound-format-error --ume_block 0 .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
