name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the browser bundle (pygbag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pygbag
      - name: Render the procedural audio (about a minute)
        run: python tools/gen_audio.py
      - name: Convert the audio to OGG (much smaller, and what browsers want)
        run: |
          find assets/audio -name '*.wav' -print0 | while IFS= read -r -d '' f; do
            ffmpeg -y -loglevel error -i "$f" -c:a libvorbis -q:a 3 "${f%.wav}.ogg"
            rm -f "$f"
          done
      - name: pygbag build
        # pygbag always treats the last argument as the app dir; keep flags before it.
        run: python -m pygbag --build .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
