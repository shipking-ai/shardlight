name: Release

on:
  push:
    tags: ["v*"]

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Render the procedural audio
        run: python tools/gen_audio.py
      - name: Verify audio manifest
        run: python tools/gen_audio.py --check
      - name: PyInstaller build
        run: >
          python -m PyInstaller main.py --name SHARDLIGHT --onedir --noconfirm
          --add-data "data;data" --add-data "assets;assets"
      - name: Zip the bundle
        run: Compress-Archive -Path dist/SHARDLIGHT -DestinationPath SHARDLIGHT-windows.zip
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: SHARDLIGHT-windows.zip
