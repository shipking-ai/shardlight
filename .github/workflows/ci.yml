name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows, Python 3.12 (the platform this was developed and tested on)
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        id: audio-cache
        with:
          path: assets/audio
          key: audio-${{ runner.os }}-${{ hashFiles('tools/gen_audio.py', 'shardlight/**/*.py') }}
      - run: python -m pip install -r requirements.txt
      - name: Render the procedural audio (about a minute)
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: python tools/gen_audio.py
      - name: Verify audio manifest
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: python tools/gen_audio.py --check
      - name: Tests
        run: python -m pytest tests -q -p no:cacheprovider

  linux:
    name: Linux, Python 3.12 (headless tests only; nobody has played it on Linux)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        id: audio-cache
        with:
          path: assets/audio
          key: audio-${{ runner.os }}-${{ hashFiles('tools/gen_audio.py', 'shardlight/**/*.py') }}
      - run: python -m pip install -r requirements.txt
      - name: Render the procedural audio
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: python tools/gen_audio.py
      - name: Tests
        run: python -m pytest tests -q -p no:cacheprovider
