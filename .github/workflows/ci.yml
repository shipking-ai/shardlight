name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows, Python 3.12 (the platform this was developed and tested on)
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Render the procedural audio (about a minute)
        run: python tools/gen_audio.py
      - name: Verify audio manifest
        run: python tools/gen_audio.py --check
      - name: Tests
        run: python -m pytest tests -q -p no:cacheprovider

  linux:
    name: Linux, Python 3.12 (headless tests only; nobody has played it on Linux)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/gen_audio.py
      - run: python -m pytest tests -q -p no:cacheprovider
